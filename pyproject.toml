[project]
name = "dytool"
version = "0.1.0"
description = "Tải video Douyin theo từ khóa/kênh, edit bằng FFmpeg, đăng lên Facebook Fanpage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "faster-whisper>=1.1",
    "deep-translator>=1.11",
    "rich>=13.7",
    "pycookiecheat>=0.8; sys_platform != 'win32'",   # chỉ macOS/Linux; Windows dùng `dytool douyin-login`
    "soundfile>=0.12",                                 # torchaudio/demucs ghi WAV trên Windows
    "rapidocr>=3.10.0",
    "onnxruntime>=1.31.1",
    "demucs>=4.1.0",
    "anthropic>=0.60",
    "torch>=2.5",
    "torchaudio>=2.5",
    "playwright>=1.65.0",
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
]

[project.scripts]
dytool = "dytool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Mac Apple Silicon + Windows 64-bit. Không có Mac Intel: ở đó uv buộc phải chọn torch<2.3 (lỗi với numpy 2).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
