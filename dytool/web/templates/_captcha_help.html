{# Hướng dẫn tiếng Việt cho các kiểu captcha Douyin hay gặp — người dùng tự giải (dytool không tự giải captcha) #}
<dialog id="captcha-guide" class="dy-confirm captcha-help" aria-labelledby="captcha-guide-title" style="width:min(620px,92vw);max-height:85vh;overflow:auto">
  <form method="dialog" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
    <h2 id="captcha-guide-title">Hướng dẫn xác minh Douyin</h2>
    <button class="btn sm" autofocus>Đóng</button>
  </form>
  {% include "_captcha_steps.html" %}
</dialog>
<script>
  {# Mở hướng dẫn: trong app desktop = cửa sổ nổi luôn trên cùng (đặt cạnh cửa sổ Douyin); trình duyệt thường /
     app không mở được cửa sổ nổi = hộp hướng dẫn trong trang #}
  window.__dyCaptchaGuide = async () => {
    try {
      if ((await fetch('/captcha/float', { method: 'POST' })).ok) return;
    } catch (_) {}
    const g = document.getElementById('captcha-guide');
    if (g && !g.open) g.showModal();
  };
  (() => {
    const guide = document.getElementById('captcha-guide');
    if (!guide || guide.open) return;
    const episode = {{ it.captcha_since | default(it.sub) | string | tojson }};
    try {
      if (sessionStorage.getItem('dytool-captcha-guide') === episode) return;
      sessionStorage.setItem('dytool-captcha-guide', episode);
    } catch (_) {}
    window.__dyCaptchaGuide();
  })();
</script>
