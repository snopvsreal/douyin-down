[project]
name = "dytool"
version = "0.3.5"
description = "Tải video Douyin theo từ khóa/kênh, edit bằng FFmpeg, đăng lên Facebook Fanpage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "faster-whisper>=1.1",
    "deep-translator>=1.11",
    "rich>=13.7",
    "pycookiecheat>=0.8; sys_platform != 'win32'",   # chỉ macOS/Linux; Windows dùng `dytool douyin-login`
    "soundfile>=0.12",                                 # torchaudio/demucs ghi WAV trên Windows
    "rapidocr>=3.10.0",
    "onnxruntime>=1.31.1",
    "demucs>=4.1.0",
    "anthropic>=0.60",
    "torch>=2.5",
    "torchaudio>=2.5",
    "playwright>=1.65.0",
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "tiktok-uploader>=1.2",
    "pywebview>=5",
    "pystray>=0.19",
    "shardx==2.1.7",            # GHIM: browsers._use_mirror thay hàm nội bộ của SDK — nâng thì thử lại
    # Lồng tiếng: model OmniVoice (github.com/k2-fsa/OmniVoice, Apache-2.0) chạy ngay trong dytool (voice_server.py)
    # — không cần cài app VoiceStudio. GHIM: voice_server gọi generate() / create_voice_clone_prompt().
    "omnivoice==0.2.1",
    "accelerate>=1.0",
]

[project.optional-dependencies]
# Chọn 1 trong 2 khi cài (setup_app.ps1 tự chọn): máy có card NVIDIA -> gpu, còn lại -> cpu.
# gpu = torch 2.14 bản CUDA 12.6: bản CUOI còn hỗ trợ card đời Pascal (GTX 10xx) — torch 2.15 bỏ Maxwell / Pascal /
# Volta. Demucs (tách giọng) nhanh ~3.3 lần trên GTX 1050 Ti so với CPU i5-8300H. Tải ~2.5 GB (bản cpu ~200 MB).
cpu = ["torch>=2.5"]
gpu = ["torch==2.14.*"]

[project.scripts]
dytool = "dytool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Mac Apple Silicon + Windows 64-bit. Không có Mac Intel: ở đó uv buộc phải chọn torch<2.3 (lỗi với numpy 2).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
# omnivoice khai báo cả phụ thuộc của giao diện demo / huấn luyện (gradio, tensorboardX, webdataset) và librosa (chỉ để
# đọc mp3 — voice_server đổi mọi file sang wav bằng ffmpeg trước). Phần đọc giọng không dùng -> không cài.
override-dependencies = [
    "gradio ; sys_platform == 'never'",
    "tensorboardx ; sys_platform == 'never'",
    "webdataset ; sys_platform == 'never'",
    "librosa ; sys_platform == 'never'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "gpu", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
