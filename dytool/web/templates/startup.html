<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# màn hình khởi động app desktop: bật hết dịch vụ rồi mới vào màn hình chính (web/app.py begin_startup) #}
  <script>try { const t = localStorage.getItem('dy-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  try { if (localStorage.getItem('dy-app') === '1') document.documentElement.classList.add('in-app'); } catch (e) {}</script>
  <title>Đang khởi động · dytool</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="preload" href="/static/fonts/bevietnampro-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/bevietnampro-400-vietnamese.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css?v={{ css_v() }}">
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: var(--canvas); color: var(--t1); display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    html.in-app body { app-region: drag; }
    html.in-app .boot a, html.in-app .boot button, html.in-app .winctl { app-region: no-drag; }
    .boot { width: min(460px, 100%); background: var(--surface); border-radius: var(--r-panel, 12px); padding: 28px 28px 22px;
            box-shadow: 0 1px 2px #0000000d; }
    .boot-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .boot-head img { width: 36px; height: 36px; border-radius: 8px; }
    .boot-head h1 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
    .boot-head p { margin: 2px 0 0; font-size: 13px; color: var(--t2); }
    .bar { height: 6px; border-radius: 3px; background: var(--tile); overflow: hidden; margin-bottom: 18px; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 3px; transition: width .4s ease; }
    .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .steps li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13.5px; }
    .steps .ic { width: 18px; height: 18px; margin-top: 1px; }
    .steps .nm { font-weight: 500; }
    .steps .dt { display: block; color: var(--t2); font-size: 12.5px; margin-top: 1px; overflow-wrap: anywhere; }
    .steps li[data-state="wait"] { color: var(--t3); }
    .ic.spin { border: 2px solid var(--tile-line); border-top-color: var(--primary); border-radius: 50%; box-sizing: border-box;
               width: 16px; height: 16px; margin: 2px 1px 0; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ic.spin { animation-duration: 2.4s; } .bar > i { transition: none; } }
    .ic.ok { color: var(--ok-text); } .ic.warn { color: var(--warn-text); } .ic.err { color: var(--err-text); } .ic.wait { color: var(--t3); }
    .boot-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; font-size: 12.5px; color: var(--t2); }
  </style>
</head>
<body>
<div class="winctl" role="group" aria-label="Cửa sổ">
  <button type="button" data-win="min" title="Thu nhỏ" aria-label="Thu nhỏ">
    <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M0 5.5h10"/></svg></button>
  <button type="button" data-win="max" title="Phóng to" aria-label="Phóng to">
    <svg class="i-max" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9" rx="1"/></svg>
    <svg class="i-restore" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><rect x=".5" y="2.5" width="7" height="7" rx="1"/><path d="M2.5 2.5V1.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-1"/></svg></button>
  <button type="button" data-win="close" class="close" title="Đóng — dytool vẫn chạy ở khay hệ thống" aria-label="Đóng">
    <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="m.5.5 9 9M9.5.5l-9 9"/></svg></button>
</div>

<main class="boot" aria-labelledby="boot-title">
  <div class="boot-head">
    <img src="/static/icon.png" alt="" width="36" height="36">
    <div><h1 id="boot-title">Đang chuẩn bị dytool…</h1>
      <p id="boot-sub">Bật các dịch vụ để mọi chức năng sẵn sàng</p></div>
  </div>
  <div class="bar" role="progressbar" aria-label="Tiến độ khởi động" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
  <ul class="steps" id="steps" aria-live="polite">
    {% for key, s in steps.items() %}
    <li data-key="{{ key }}" data-state="{{ s.state }}"><span class="ic {{ s.state }}"></span>
      <span><span class="nm">{{ s.name }}</span><span class="dt">{{ s.detail }}</span></span></li>
    {% endfor %}
  </ul>
  <div class="boot-foot">
    <span id="boot-time"></span>
    <a class="btn sm" href="/" id="boot-skip">Vào luôn</a>
  </div>
</main>

<script>
(() => {
  const html = document.documentElement;
  const ICONS = {
    ok: '<svg viewBox="0 0 18 18" width="18" height="18" aria-label="Xong"><circle cx="9" cy="9" r="8" fill="currentColor" opacity=".16"/><path d="m5.5 9.2 2.3 2.3 4.7-4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    warn: '<svg viewBox="0 0 18 18" width="18" height="18" aria-label="Cần chú ý"><circle cx="9" cy="9" r="8" fill="currentColor" opacity=".16"/><path d="M9 5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="12.8" r="1.1" fill="currentColor"/></svg>',
    err: '<svg viewBox="0 0 18 18" width="18" height="18" aria-label="Lỗi"><circle cx="9" cy="9" r="8" fill="currentColor" opacity=".16"/><path d="m6.3 6.3 5.4 5.4m0-5.4-5.4 5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    wait: '<svg viewBox="0 0 18 18" width="18" height="18" aria-label="Đang chờ"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/></svg>',
  };
  const bar = document.querySelector('.bar'), fill = bar.firstElementChild;
  let left = false;
  const go = () => { if (!left) { left = true; location.replace('/'); } };

  const draw = (st) => {
    let doneN = 0;
    for (const s of st.steps) {
      const li = document.querySelector(`li[data-key="${s.key}"]`); if (!li) continue;
      li.dataset.state = s.state;
      const ic = li.querySelector('.ic');
      if (s.state === 'run') { ic.className = 'ic spin'; ic.innerHTML = ''; }
      else { ic.className = 'ic ' + s.state; ic.innerHTML = ICONS[s.state] || ''; }
      li.querySelector('.dt').textContent = s.detail || '';
      if (['ok', 'warn', 'err'].includes(s.state)) doneN += 1;
    }
    const pct = st.done ? 100 : Math.round(doneN / st.steps.length * 100);
    fill.style.width = pct + '%'; bar.setAttribute('aria-valuenow', pct);
    document.getElementById('boot-time').textContent = st.elapsed ? `${st.elapsed} giây` : '';
    if (st.done) {
      const bad = st.steps.filter((s) => s.state === 'warn' || s.state === 'err').length;
      document.getElementById('boot-title').textContent = 'Sẵn sàng';
      document.getElementById('boot-sub').textContent = bad ? `${bad} mục cần chú ý — xem ở trang Hôm nay` : 'Mọi chức năng đã sẵn sàng';
      const skip = document.getElementById('boot-skip');
      skip.textContent = 'Vào màn hình chính'; skip.classList.add('primary');
      setTimeout(go, bad ? 3500 : 800);
      return true;
    }
    return false;
  };

  const poll = async () => {
    try {
      const r = await fetch('/startup/status', {cache: 'no-store'});
      if (r.ok && draw(await r.json())) return;
    } catch (e) {}
    if (!left) setTimeout(poll, 700);
  };
  poll();

  // 3 nút cửa sổ (app desktop không thanh tiêu đề) — như base.html
  const api = () => window.pywebview && window.pywebview.api;
  const ready = () => {
    const a = api(); if (!a || !a.win) return;
    html.classList.add('in-app');
    try { localStorage.setItem('dy-app', '1'); } catch (e) {}
    if (a.bg) requestAnimationFrame(() => a.bg(getComputedStyle(html).getPropertyValue('--canvas').trim()));
  };
  window.addEventListener('pywebviewready', ready);
  ready();
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-win]'); if (!b) return;
    const a = api(); if (a && a.win) a.win(b.dataset.win).then((s) => s && html.classList.toggle('win-max', !!s.max));
  });
})();
</script>
</body>
</html>
